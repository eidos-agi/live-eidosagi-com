[project]
name = "eidos-live-mcp"
version = "0.2.0"
description = "HTTP-client MCP for live.eidosagi.com — logs session events + benchmark telemetry"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Daniel Shanklin" }]
dependencies = [
  "mcp>=1.0.0",
  "httpx>=0.27.0",
]

[project.scripts]
eidos-live-mcp = "eidos_live.server:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
